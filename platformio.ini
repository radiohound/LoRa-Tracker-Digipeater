; ============================================================
; STM32WLE5 Low-Power LoRa APRS Tracker + Digipeater
; Target: Ebyte E77-400MBL-01 dev board (stm32wle5cc)
; Also compatible with Nucleo-WL55JC (see RF switch notes in config.h)
; ============================================================

[env:ebyte_e77_dev]
; ststm32 20.x ships STM32 Arduino core 3.x, which STM32LowPower 2.x
; and STM32duino RTC 2.x require. Keep these majors in step.
platform  = ststm32@^20.0.0
board     = lora_e5_dev_board
board_build.mcu = stm32wle5cc
framework = arduino

debug_tool       = stlink
upload_protocol  = stlink

build_flags =
    -D ARDUINO_ARCH_STM32
    ; Reduce clock to 16 MHz at startup to save power.
    ; RadioLib and the STM32 core handle the rest.
    -D HSE_VALUE=32000000
    ; Suppress RadioLib verbose debug output in release builds.
    ; Comment out to enable:
    ; -D RADIOLIB_DEBUG
    ; -D RADIOLIB_VERBOSE

lib_deps =
    jgromes/RadioLib@^7.8.1
    richonguzman/APRSPacketLib@^1.0.10
    ; Git deps are pinned to tags — unpinned they track master and
    ; can jump to a release that needs a different STM32 core.
    https://github.com/sparkfun/SparkFun_u-blox_GNSS_Arduino_Library.git#v2.2.29
    https://github.com/stm32duino/STM32LowPower.git#2.0.0
    stm32duino/STM32duino RTC@^2.0.0
    adafruit/Adafruit BMP280 Library@^3.0.0
    adafruit/Adafruit BusIO@^1.17.4

monitor_speed = 115200
