; ============================================================
; STM32WLE5 Low-Power LoRa APRS Tracker + Digipeater
; Target: Ebyte E77-400MBL-01 dev board (stm32wle5cc)
; Also compatible with Nucleo-WL55JC (see RF switch notes in config.h)
; ============================================================

[env:ebyte_e77_dev]
platform  = ststm32
board     = lora_e5_dev_board
board_build.mcu = stm32wle5cc
framework = arduino

debug_tool       = stlink
upload_protocol  = stlink

build_flags =
    -D ARDUINO_ARCH_STM32
    ; Reduce clock to 16 MHz at startup to save power.
    ; RadioLib and the STM32 core handle the rest.
    -D HSE_VALUE=32000000
    ; Suppress RadioLib verbose debug output in release builds.
    ; Comment out to enable:
    ; -D RADIOLIB_DEBUG
    ; -D RADIOLIB_VERBOSE

lib_deps =
    jgromes/RadioLib@^7.1.2
    richonguzman/APRSPacketLib@^1.0.4
    https://github.com/sparkfun/SparkFun_u-blox_GNSS_Arduino_Library
    ; pinned: 2.0.0 refuses to build against the current STM32 core (needs core > 2.12)
    https://github.com/stm32duino/STM32LowPower#1.5.0
    stm32duino/STM32duino RTC@^1.6.0
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit BusIO@^1.16.1

monitor_speed = 115200
build_src_filter = +<*> -<horus_tcxo_test.cpp> -<rf_check.cpp> -<horus/>

; ============================================================
; Horus Binary 4FSK TCXO test builds (src/horus_tcxo_test.cpp).
; Both loop one fixed Horus v2 test packet (payload ID 256) on 434.200 MHz.
;   horus_test_old   radio controls the TCXO (known-bad comparison)
;   horus_test_hold  MCU keeps the TCXO powered, radio TCXO delay = 0
; ============================================================
[env:horus_test_old]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<horus_tcxo_test.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D TCXO_HOLD=0
    -D TCXO_DELAY_US=5000

[env:horus_test_hold]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<horus_tcxo_test.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D TCXO_HOLD=1
    -D TCXO_DELAY_US=0

; RF chain check, no GPS: LoRa packet + 2 s carrier at reset and every 5 s
[env:rf_check]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<rf_check.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower

; Split tests: which of the two hold-build changes stops the radio transmitting?
[env:horus_test_holdonly]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<horus_tcxo_test.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D TCXO_HOLD=1
    -D TCXO_DELAY_US=5000

[env:horus_test_delay0]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<horus_tcxo_test.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D TCXO_HOLD=0
    -D TCXO_DELAY_US=0

; Delay sweep with the MCU hold on: TD=<microseconds> pio run -e horus_test_sweep -t upload
[env:horus_test_sweep]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<horus_tcxo_test.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D TCXO_HOLD=1
    -D TCXO_DELAY_US=${sysenv.TD}

; Same test, but sending with RadioLib FSK4Client (the library path the tracker would use).
; Old configuration: radio controls the TCXO, 5000 us delay, no MCU hold.
[env:horus_test_fsk4]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<horus_tcxo_test.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D USE_FSK4=1
    -D TCXO_HOLD=0
    -D TCXO_DELAY_US=5000

; FSK4Client with the MCU clocked from the TCXO (HSE32) so micros() is accurate.
[env:horus_test_fsk4_hse]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<horus_tcxo_test.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D USE_FSK4=1
    -D SYSCLK_HSE=1
    -D TCXO_HOLD=0
    -D TCXO_DELAY_US=5000

; SondeHub upload test: pre-built UTC-stamped packets, counter 1..N, then stops.
; Needs src/horus_packets.h, which is GENERATED and not committed (its timestamps go stale);
; build it with the horusdemodlib l2 encoder first, stamped for the time you will flash.
[env:horus_test_timed]
extends = env:ebyte_e77_dev
build_src_filter = -<*> +<horus_tcxo_test.cpp>
lib_ignore = STM32duino Low Power, STM32LowPower
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D USE_FSK4=1
    -D SYSCLK_HSE=1
    -D USE_TIMED_PKTS=1
    -D TCXO_HOLD=0
    -D TCXO_DELAY_US=5000

; ============================================================
; Tracker with Horus Binary v2 (4FSK). Third-party LGPL code in src/horus/ is compiled in here
; only. Set HORUS_PAYLOAD_ID / HORUS_FREQ_MHZ / HORUS_TX_POWER_DBM in config.h.
; ============================================================
[env:ebyte_e77_horus]
extends = env:ebyte_e77_dev
build_src_filter = +<*> -<horus_tcxo_test.cpp> -<rf_check.cpp>
build_flags = ${env:ebyte_e77_dev.build_flags}
    -D HORUS_ENABLED=1
    -D INTERLEAVER
    -D SCRAMBLER
    -I src/horus

; Bench test without a GPS: fake fix, 3 s fix timeout, HP PA only so low power is real low power.
; Payload ID for the K6ATV station next door (the frequency is the config.h default).
[env:ebyte_e77_horus_bench]
extends = env:ebyte_e77_horus
build_flags = ${env:ebyte_e77_horus.build_flags}
    -D HORUS_FAKE_FIX
    -D GPS_FIX_TIMEOUT_MS=3000
    -D RF_HP_PA_ONLY=1
    -D HORUS_PAYLOAD_ID=930
    -D HORUS_TX_POWER_DBM=-9
    -D HORUS_TIME_SYNC_SECONDS=10
    -D HORUS_TIME_SYNC_OFFSET_SECONDS=5
